name: Deploy PWA to Pages

on:
  push:
    branches: ["main"] # Change to 'master' if your default branch is master
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Inject PWA requirements into index.html
        run: |
          # Injects the manifest link right before </head>
          sed -i 's|</head>|<link rel="manifest" href="manifest.json"></head>|' index.html
          # Injects the Service Worker registration right before </body>
          sed -i 's|</body>|<script>if("serviceWorker" in navigator){navigator.serviceWorker.register("sw.js");}</script></body>|' index.html
          
      - name: Setup Pages
        uses: actions/configure-pages@v5
        
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'
          
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
